name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q multialign
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Exercise project initialization
        run: |
          python -m multialign layout
          python -m multialign init "$RUNNER_TEMP/multialign-project" \
            --references left right top \
            --target target \
            --anchor left \
            --scale-reference right
